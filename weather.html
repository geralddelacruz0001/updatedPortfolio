<div class="weather-modal-content">
  <div class="wm-header">
    <h2>Manila Weather</h2>
    <button class="wm-close" id="closeWeatherModal">✕</button>
  </div>
  <div class="wm-main">
    <span class="wm-icon" id="wmIcon">⛅</span>
    <div>
      <span class="wm-temp" id="wmTemp">--°C</span>
      <p class="wm-desc" id="wmDesc">Loading...</p>
    </div>
  </div>
  <div class="wm-forecast" id="weatherForecast">
    <div class="loading-spinner"></div>
  </div>
</div>

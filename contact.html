<header class="app-header">
  <button class="back-btn" onclick="goHome()">←</button>
  <h2>Contact Me</h2>
</header>
<div class="app-content">
  <div class="contact-info-card">
    <p>📧 <span id="dynEmail">Loading...</span></p>
    <p>📱 <span id="dynPhone">Loading...</span></p>
    <p>📍 <span id="dynLocation">Loading...</span></p>
  </div>

  <p style="margin-bottom: 16px; color: var(--text-dim); font-size: 13px; margin-top: 20px;">
    O kaya, i-drop mo ang message mo dito:
  </p>

  <form id="contactForm" class="contact-form">
    <input type="text" id="cName" placeholder="Your Name" required />
    <input type="email" id="cEmail" placeholder="Your Email" required />
    <textarea id="cMessage" placeholder="Your Message..." rows="3" required></textarea>
    <button type="submit" class="save-btn">Send Message 🚀</button>
  </form>
  <p id="formStatus" style="text-align: center; margin-top: 10px; font-size: 12px; color: #00b894; display: none;">Sending...</p>
</div>

<header class="app-header">
  <button class="back-btn" onclick="goHome()">←</button>
  <h2>Tic-Tac-Toe</h2>
</header>
<div class="app-content game-container">
  
  <!-- SCOREBOARD -->
  <div class="score-board">
    <div class="score-box">
      <span class="score-label">You (X)</span>
      <span class="score-val" id="scoreX">0</span>
    </div>
    <div class="score-box">
      <span class="score-label">Draws</span>
      <span class="score-val" id="scoreDraw">0</span>
    </div>
    <div class="score-box">
      <span class="score-label" id="opponentLabel">AI (O)</span>
      <span class="score-val" id="scoreO">0</span>
    </div>
  </div>

  <!-- MODE SELECTOR -->
  <div class="mode-selector">
    <button class="mode-btn active" id="modePvP">👥 2 Players</button>
    <button class="mode-btn" id="modeAI">🤖 vs Computer</button>
  </div>

  <!-- DIFFICULTY & FIRST MOVE -->
  <div class="ai-settings" id="aiSettings" style="display: none;">
    <div class="ai-row">
      <span>Difficulty:</span>
      <button class="diff-btn" data-diff="easy">Easy</button>
      <button class="diff-btn active" data-diff="medium">Medium</button>
      <button class="diff-btn" data-diff="hard">Hard</button>
    </div>
    <div class="ai-row">
      <span>First Move:</span>
      <button class="first-btn active" id="firstPlayer">You</button>
      <button class="first-btn" id="firstAI">AI</button>
    </div>
  </div>

  <div class="game-status" id="gameStatus">Player X's turn</div>
  
  <div class="tic-tac-toe" id="ticTacToe">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>
  
  <button id="resetGame" class="save-btn" style="margin-top: 16px; width: 100%;">Restart Round 🔄</button>

  <!-- MATCH HISTORY -->
  <div class="match-history" id="matchHistory">
    <h4>Match History</h4>
    <ul id="historyList">
      <li class="empty-history">No matches yet. Play one!</li>
    </ul>
  </div>
</div>
